name: sandbox-layers
# ชั้นสาธารณะของ Dan Ting Sandbox (ไม่มีข้อมูลครัวเรือน): น้ำท่วมซ้ำซาก → region/data/sandbox/floodfreq.geojson
# ตั้งแต่ 9 ต.ค. 69 ใช้ API ของ GISTDA (ผลิตภัณฑ์เดียวกับภาพ tile · ปี 2011–2023) แทน EE asset FloodGCS ซึ่งนับสูงกว่า ~2 ขั้น
# กดรันเอง (Actions → sandbox-layers → Run workflow) · รันเองทุกวันที่ 1 ของเดือน · หรือเมื่อแก้สคริปต์บน main
# source=ee = ใช้สคริปต์ Earth Engine เดิม (สำรอง · ต้องเลือกเอง)
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'แหล่งข้อมูล: gistda (ค่าเริ่มต้น) หรือ ee (FloodGCS เดิม)'
        default: 'gistda'
      asset:
        description: '(เฉพาะ ee) EE asset น้ำท่วมซ้ำซาก'
        default: 'projects/ee-sarochineek/assets/FloodGCS'
      field:
        description: '(เฉพาะ ee) ชื่อ field ความถี่ (ว่าง = ค้นอัตโนมัติ)'
        default: ''
      inspect:
        description: '(เฉพาะ ee) ตรวจโครงสร้าง asset อย่างเดียว ไม่เขียน/ไม่ commit'
        type: boolean
        default: false
  schedule:
    - cron: '20 3 1 * *'        # วันที่ 1 ของทุกเดือน 10:20 น.
  push:
    branches: [main]
    paths: [scripts/region/build_sandbox_floodfreq_gistda.py, scripts/region/build_sandbox_floodfreq.py]
concurrency: { group: sandbox-layers, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install --quiet earthengine-api shapely
      - name: น้ำท่วมซ้ำซาก (API GISTDA flood-recurrence)
        if: ${{ (inputs.source || 'gistda') == 'gistda' }}
        env: { GISTDA_API_KEY: '${{ secrets.GISTDA_API_KEY }}' }
        run: python scripts/region/build_sandbox_floodfreq_gistda.py
      - name: น้ำท่วมซ้ำซาก (สำรอง · Earth Engine FloodGCS)
        if: ${{ inputs.source == 'ee' }}
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ee-sarochineek
          FF_ASSET: ${{ inputs.asset }}
          FF_FIELD: ${{ inputs.field }}
          FF_INSPECT: ${{ inputs.inspect && '1' || '0' }}
        run: python scripts/region/build_sandbox_floodfreq.py
      - name: commit ผลลัพธ์
        if: ${{ !inputs.inspect }}
        # เหมือน osm-rivers: ย้อนไปที่ main ล่าสุดแล้ววางไฟล์ทับ (ไม่ conflict กับ region-live)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F=region/data/sandbox/floodfreq.geojson
          [ -f "$F" ] || { echo "ไม่มีไฟล์ใหม่"; exit 0; }
          cp "$F" /tmp/floodfreq.geojson
          for i in 1 2 3 4; do
            git fetch --quiet origin main && git reset --quiet --hard origin/main
            mkdir -p region/data/sandbox && cp /tmp/floodfreq.geojson "$F" && git add "$F"
            git diff --staged --quiet && { echo "ไม่มีข้อมูลเปลี่ยน"; exit 0; }
            git commit --quiet -m "data(sandbox): น้ำท่วมซ้ำซาก $(date -u '+%Y-%m-%d')"
            git push --quiet origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
