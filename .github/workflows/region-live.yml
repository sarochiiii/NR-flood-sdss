name: region-live
on:
  schedule:
    - cron: '15 * * * *'        # ทุกชั่วโมง (นาทีที่ 15) — เก็บประวัติระดับน้ำ
  workflow_dispatch:
concurrency: { group: live-data, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: ติดตั้ง library (เฉพาะ GISTDA และ Sentinel-1)
        run: pip install --quiet shapely pyproj earthengine-api
      - name: ฝนรายตำบล (Open-Meteo)
        run: python scripts/region/fetch_rain.py
      - name: สถานีฝนและระดับน้ำ (ThaiWater)
        run: python scripts/region/fetch_thaiwater.py
      - name: ฝนสะสม 1/3/7 วัน และอ่างเก็บน้ำ (ThaiWater จังหวัด)
        run: python scripts/region/fetch_tw_province.py
      - name: น้ำท่วม 7 วัน (GISTDA)
        env: { GISTDA_API_KEY: '${{ secrets.GISTDA_API_KEY }}' }
        run: python scripts/region/fetch_gistda_flood.py
      - name: ภาพ Sentinel-1 ล่าสุด (Earth Engine)
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ee-sarochineek
        run: python scripts/region/fetch_s1.py
      - name: บันทึกประวัติระดับน้ำและอ่าง
        run: python scripts/region/update_history.py
      - name: คำนวณระดับความเสี่ยง
        run: python scripts/region/compute_risk.py
      - name: commit ผลลัพธ์
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region/data/live/
          git diff --staged --quiet || { git commit -m "data(region): อัปเดตข้อมูลสด $(date -u '+%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push; }
