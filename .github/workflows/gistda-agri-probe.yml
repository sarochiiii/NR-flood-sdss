name: gistda-agri-probe
# วินิจฉัย: หา API พื้นที่การเกษตร (อ้อย มันสำปะหลัง ข้าวโพด ข้าว) ของ GISTDA สำหรับแท็บ "ภัยแล้ง" — พิมพ์ผลใน log เท่านั้น · ไม่ commit · ปิดบัง key
on:
  push:          # รันเมื่อแก้สคริปต์บน branch ทดลอง (workflow_dispatch ใช้ได้เฉพาะเมื่อไฟล์นี้อยู่บน main)
    branches-ignore: [main]
    paths: [scripts/region/probe_gistda_agri.py, .github/workflows/gistda-agri-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: ค้นชุดข้อมูลและเรียก API พื้นที่การเกษตรของ GISTDA
        env: { GISTDA_API_KEY: '${{ secrets.GISTDA_API_KEY }}', OUT_DIR: probe_out }
        run: python scripts/region/probe_gistda_agri.py
      - name: เก็บภาพทดลอง (artifact 3 วัน · ไม่ commit)
        uses: actions/upload-artifact@v4
        with: { name: agri-probe, path: probe_out/, retention-days: 3, if-no-files-found: ignore }
